package:
  name: primecount
  version: "7.16"
  tag:
    - library
    - static_library
    - cmake
source:
  url: https://github.com/kimwalisch/primecount/archive/refs/tags/v7.16.tar.gz
  sha256: 437cde8198fbfed3a16510786d99edb22da2766f0f0376450690d55a74ea5cf3
requirements:
  host:
    - primesieve
  run: []
about:
  home: https://github.com/kimwalisch/primecount
  summary: Fast prime counting function implementations
  license: BSD-2-Clause
build:
  type: static_library
  script: |
    emcmake cmake -DCMAKE_VERBOSE_MAKEFILE=OFF \
          -DCMAKE_INSTALL_PREFIX=${WASM_LIBRARY_DIR} \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DBUILD_STATIC_LIBS=ON \
          -DBUILD_SHARED_LIBS=OFF \
          .
    emmake make -j ${PYODIDE_JOBS:-3}
    emmake make install
extra:
  recipe-maintainers:
    - mkoeppe
