name: Comment Test Summary

on:
  workflow_run:
    workflows: ["Build Recipes"]
    types:
      - completed

permissions:
  pull-requests: write
  contents: read

# copied from: https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#workflow_run
jobs:
  download:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    steps:
      - name: 'Download artifact'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            const fs = require('fs');
            const path = require('path');
            const temp = '${{ runner.temp }}/artifacts';
            if (!fs.existsSync(temp)){
              fs.mkdirSync(temp);
            }

            for (const artifact of allArtifacts.data.artifacts) {
              if (artifact.name.startsWith('test-result-')) {
                console.log(`Downloading artifact: ${artifact.name}`);
                let download = await github.rest.actions.downloadArtifact({
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   artifact_id: artifact.id,
                   archive_format: 'zip',
                });
                fs.writeFileSync(path.join(temp, `${artifact.name}.zip`), Buffer.from(download.data));
              }
            }

      - name: 'Unzip artifacts'
        run: |
          for zip in ${{ runner.temp }}/artifacts/*.zip; do
            unzip -o "$zip" -d "${{ runner.temp }}/artifacts/$(basename "$zip" .zip)"
          done

      - name: 'Comment on PR'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const temp = '${{ runner.temp }}/artifacts';
            let issue_number;
            let summaryContent = '';

            const artifactDirs = fs.readdirSync(temp, { withFileTypes: true })
              .filter(dirent => dirent.isDirectory())
              .map(dirent => dirent.name);

            for (const dir of artifactDirs) {
              if (dir.startsWith('test-result-')) {
                const summaryPath = path.join(temp, dir, 'test_summary.md');
                const prNumberPath = path.join(temp, dir, 'pr_number');

                if (fs.existsSync(summaryPath)) {
                  summaryContent += fs.readFileSync(summaryPath, 'utf8') + '\\n\\n';
                }
                if (!issue_number && fs.existsSync(prNumberPath)) {
                  issue_number = Number(fs.readFileSync(prNumberPath, 'utf8'));
                }
              }
            }

            if (!issue_number || !summaryContent) {
              console.log('No issue number or summary content found. Exiting.');
              return;
            }

            const header = '## :x: Test Failures';
            const body = header + '\\n\\n' + summaryContent;

            // Search for existing test summary comments
            const comments = await github.rest.issues.listComments({
              issue_number: issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            // Look for a comment that was created by the GitHub Actions bot
            const testSummaryComment = comments.data.find(comment => 
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes(header)
            );

            if (testSummaryComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: testSummaryComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
              console.log(`Updated existing test summary comment ID: ${testSummaryComment.id}`);
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: issue_number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
              console.log('Created new test summary comment');
            }
